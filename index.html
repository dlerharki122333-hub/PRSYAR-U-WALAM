<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velmorth - پسیار و وڵام</title>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --gold-dark: #B8860B;
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a2e;
    --card: #16213e;
    --text: #e8e8f0;
    --text2: #a0a0b8;
    --green: #00ff88;
    --red: #ff4466;
    --medium-c: #ff8800;
    --easy: #00cc66;
    --hard: #ff2244;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Scheherazade New', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 18px;
  }
  body::before {
    content:'';
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(68,136,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(153,68,255,0.08) 0%, transparent 50%);
    pointer-events:none; z-index:0;
  }

  #landing {
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height:100vh; padding:2rem; position:relative; z-index:1;
  }
  .logo-area { text-align:center; margin-bottom:2.5rem; animation:fadeDown 0.8s ease; }
  .logo-title {
    font-size: clamp(3rem,10vw,6rem); font-weight:700; letter-spacing:0.1em;
    background:linear-gradient(135deg,var(--gold),#fff,var(--gold));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 30px rgba(255,215,0,0.4));
    font-family: 'Arial Black', sans-serif;
  }
  .logo-sub { font-size:1.2rem; color:var(--text2); margin-top:0.5rem; }
  .creator-badge {
    display:inline-block;
    background:linear-gradient(135deg,var(--gold-dark),var(--gold));
    color:#000; padding:0.3rem 1.2rem; border-radius:50px;
    font-size:1rem; font-weight:700; margin-top:1rem;
  }
  .categories-grid {
    display:grid; grid-template-columns:repeat(2,1fr);
    gap:1.2rem; max-width:580px; width:100%;
    animation:fadeUp 0.8s ease 0.2s both;
  }
  .cat-card {
    background:var(--card); border:1px solid rgba(255,215,0,0.15);
    border-radius:20px; padding:2rem 1.5rem; text-align:center;
    cursor:pointer; transition:all 0.3s; position:relative; overflow:hidden;
  }
  .cat-card:hover { transform:translateY(-5px); border-color:var(--gold); box-shadow:0 10px 40px rgba(255,215,0,0.2); }
  .cat-icon { font-size:2.5rem; margin-bottom:0.8rem; display:block; }
  .cat-name { font-size:1.3rem; font-weight:700; color:var(--gold); }
  .cat-count { font-size:0.9rem; color:var(--text2); margin-top:0.3rem; }

  #quiz-page { display:none; min-height:100vh; padding:1.2rem; position:relative; z-index:1; }

  .quiz-header {
    display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;
  }
  .back-btn {
    background:var(--card); border:1px solid rgba(255,215,0,0.3);
    color:var(--gold); padding:0.5rem 1rem; border-radius:10px;
    cursor:pointer; font-family:'Scheherazade New',serif; font-size:1rem; transition:all 0.2s;
  }
  .back-btn:hover { background:rgba(255,215,0,0.1); }
  .quiz-info { display:flex; align-items:center; gap:0.8rem; }
  .q-counter {
    background:var(--card); border:1px solid rgba(255,215,0,0.3);
    border-radius:10px; padding:0.4rem 0.9rem; font-size:1rem; color:var(--gold); font-weight:700;
  }
  .score-display {
    background:linear-gradient(135deg,var(--gold-dark),var(--gold));
    color:#000; border-radius:10px; padding:0.4rem 0.9rem; font-size:1rem; font-weight:700;
  }

  .level-banner {
    text-align:center; padding:0.5rem; border-radius:12px; margin-bottom:1rem; font-size:1.1rem; font-weight:700;
  }
  .banner-easy { background:rgba(0,204,102,0.15); color:var(--easy); border:1px solid rgba(0,204,102,0.3); }
  .banner-medium { background:rgba(255,136,0,0.15); color:var(--medium-c); border:1px solid rgba(255,136,0,0.3); }
  .banner-hard { background:rgba(255,34,68,0.15); color:var(--hard); border:1px solid rgba(255,34,68,0.3); }

  .progress-bar { background:var(--card); border-radius:10px; height:6px; margin-bottom:1rem; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--gold-dark),var(--gold)); border-radius:10px; transition:width 0.5s ease; }

  .timer-container { text-align:center; margin-bottom:1rem; }
  .timer-circle {
    width:80px; height:80px; border-radius:50%; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:1.8rem; font-weight:900; position:relative; transition:all 0.3s;
  }
  .timer-circle svg { position:absolute; top:0; left:0; transform:rotate(-90deg); }
  .timer-num { position:relative; z-index:1; }
  .timer-ok { color:var(--green); }
  .timer-warn { color:var(--medium-c); }
  .timer-danger { color:var(--red); animation:pulse 0.5s infinite; }

  .question-card {
    background:var(--card); border:1px solid rgba(255,215,0,0.15);
    border-radius:20px; padding:1.5rem; margin-bottom:1rem; animation:fadeIn 0.4s ease;
  }
  .question-text { font-size:1.3rem; font-weight:600; line-height:1.8; color:var(--text); }

  .options-list { display:flex; flex-direction:column; gap:0.7rem; }
  .option-btn {
    background:var(--card); border:2px solid rgba(255,215,0,0.15);
    border-radius:14px; padding:0.9rem 1rem; text-align:right;
    cursor:pointer; font-family:'Scheherazade New',serif; font-size:1.15rem;
    color:var(--text); transition:all 0.2s;
    display:flex; align-items:center; gap:0.8rem; width:100%;
  }
  .option-btn:hover:not(:disabled) { border-color:var(--gold); background:rgba(255,215,0,0.08); }
  .option-letter {
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.3);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--gold); font-size:1rem; flex-shrink:0;
  }
  .option-btn.correct { border-color:var(--green); background:rgba(0,255,136,0.1); animation:correctPop 0.4s ease; }
  .option-btn.correct .option-letter { background:var(--green); color:#000; border-color:var(--green); }
  .option-btn.wrong { border-color:var(--red); background:rgba(255,68,102,0.1); animation:shake 0.4s ease; }
  .option-btn.wrong .option-letter { background:var(--red); color:#fff; border-color:var(--red); }
  .option-btn:disabled { cursor:not-allowed; opacity:0.8; }

  .result-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.85); display:flex; align-items:center;
    justify-content:center; z-index:100; animation:fadeIn 0.3s ease; backdrop-filter:blur(10px);
  }
  .result-card {
    background:var(--bg3); border:2px solid var(--gold);
    border-radius:24px; padding:2.5rem 2rem; text-align:center;
    max-width:400px; width:90%; animation:scaleIn 0.4s ease;
    box-shadow:0 0 60px rgba(255,215,0,0.3);
  }
  .result-emoji { font-size:3.5rem; margin-bottom:0.8rem; }
  .result-title { font-size:1.8rem; font-weight:700; color:var(--gold); margin-bottom:0.5rem; }
  .result-score { font-size:3rem; font-weight:900; margin:0.8rem 0; }
  .result-score span { font-size:1.1rem; color:var(--text2); }
  .result-msg { color:var(--text2); margin-bottom:1.5rem; line-height:1.8; font-size:1.1rem; }
  .stars { font-size:1.8rem; margin:0.5rem 0; }
  .result-btns { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
  .btn-primary {
    background:linear-gradient(135deg,var(--gold-dark),var(--gold)); color:#000;
    border:none; border-radius:12px; padding:0.7rem 1.5rem;
    font-family:'Scheherazade New',serif; font-size:1.1rem; font-weight:700; cursor:pointer; transition:all 0.2s;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(255,215,0,0.4); }
  .btn-secondary {
    background:var(--card); color:var(--text); border:1px solid rgba(255,215,0,0.3);
    border-radius:12px; padding:0.7rem 1.5rem;
    font-family:'Scheherazade New',serif; font-size:1.1rem; font-weight:600; cursor:pointer; transition:all 0.2s;
  }
  .btn-secondary:hover { border-color:var(--gold); }

  @keyframes fadeDown { from{opacity:0;transform:translateY(-30px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes scaleIn { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
  @keyframes correctPop { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .particle { position:fixed; pointer-events:none; border-radius:50%; animation:particleFly 1s ease-out forwards; z-index:200; }
  @keyframes particleFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)} }
</style>
</head>
<body>

<div id="landing">
  <div class="logo-area">
    <div class="logo-title">VELMORTH</div>
    <div class="logo-sub">وێبسایتی پسیار و وڵام</div>
    <div class="creator-badge">دروستکراوی دلێر</div>
  </div>
  <div class="categories-grid">
    <div class="cat-card" onclick="startCategory('sports')">
      <span class="cat-icon">⚽</span>
      <div class="cat-name">وەرزش</div>
      <div class="cat-count">٤٥ پسیار</div>
    </div>
    <div class="cat-card" onclick="startCategory('history')">
      <span class="cat-icon">🏛️</span>
      <div class="cat-name">مێژوو</div>
      <div class="cat-count">٤٥ پسیار</div>
    </div>
    <div class="cat-card" onclick="startCategory('flags')">
      <span class="cat-icon">🌍</span>
      <div class="cat-name">مێژوو</div>
      <div class="cat-count">٤٥ پسیار</div>
    </div>
    <div class="cat-card" onclick="startCategory('islam')">
      <span class="cat-icon">🕌</span>
      <div class="cat-name">ئایینی ئیسلام</div>
      <div class="cat-count">٤٥ پسیار</div>
    </div>
  </div>
</div>

<div id="quiz-page">
  <div class="quiz-header">
    <button class="back-btn" onclick="showLanding()">← گەڕانەوە</button>
    <div class="quiz-info">
      <div class="q-counter" id="q-counter">١ / ٤٥</div>
      <div class="score-display">⭐ <span id="score-num">0</span></div>
    </div>
  </div>

  <div class="level-banner" id="level-banner"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div class="timer-container">
    <div class="timer-circle" id="timer-circle">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,215,0,0.1)" stroke-width="4"/>
        <circle cx="40" cy="40" r="35" fill="none" stroke="currentColor" stroke-width="4"
          stroke-dasharray="219.9" stroke-dashoffset="0" id="timer-arc" stroke-linecap="round"/>
      </svg>
      <span class="timer-num" id="timer-num">15</span>
    </div>
  </div>

  <div class="question-card">
    <div class="question-text" id="question-text"></div>
  </div>
  <div class="options-list" id="options-list"></div>
</div>

<script>
const LETTERS = ['أ','ب','ج','د'];

const data = {
  sports: {
    name: 'وەرزش',
    easy: [
      {q:'یاری تۆپی پێ لە چەند گێم پێکهاتووە؟',a:'٢ گێم',o:['١ گێم','٢ گێم','٣ گێم','٤ گێم']},
      {q:'هەر گێمێکی تۆپی پێ چەند خولەکە؟',a:'٤٥ خولەک',o:['٣٠ خولەک','٤٠ خولەک','٤٥ خولەک','٦٠ خولەک']},
      {q:'لە هەر تیپێکدا چەند یاریزان لەناو یاریگادان؟',a:'١١ یاریزان',o:['٩ یاریزان','١٠ یاریزان','١١ یاریزان','١٢ یاریزان']},
      {q:'کێ بەرپرسی سەرەکییە لە بەڕێوەبردنی یارییەکە؟',a:'حەکەم',o:['کابتن','حەکەم','مەنیجەر','ئەمین']},
      {q:'ئامانجی سەرەکی تۆپی پێ چییە؟',a:'دانانی گۆڵ',o:['پاراستن','دانانی گۆڵ','بازدان','کردنی کۆرنەر']},
      {q:'کێ تەنها کەسە ڕێگەی پێدراوە بە دەست تۆپەکە بگرێت؟',a:'گۆڵپارێز',o:['دیفینسەر','مەیدانیان','گۆڵپارێز','کابتن']},
      {q:'ئەو کارتەی بۆ دەرکردنی یاریزان بەکاردێت چییە؟',a:'کارتی سوور',o:['کارتی زەرد','کارتی سوور','کارتی شین','کارتی ڕەش']},
      {q:'کارت بۆ ئاگادارکردنەوەی یاریزان چییە؟',a:'کارتی زەرد',o:['کارتی سوور','کارتی زەرد','کارتی شین','کارتی سپی']},
      {q:'گەورەترین پاڵەوانێتی یانەکان لە ئەوروپا چییە؟',a:'چامپیۆنز لیگ',o:['یوروپا لیگ','سوپەرکاپ','چامپیۆنز لیگ','کۆنفەرەنس لیگ']},
      {q:'یاری کۆتایی جامی جیهانی چەند ساڵ جارێک دەکرێت؟',a:'هەر ٤ ساڵ',o:['هەر ٢ ساڵ','هەر ٣ ساڵ','هەر ٤ ساڵ','هەر ٦ ساڵ']},
      {q:'لە یاری باسکەدا تۆپەکە دەخرێتە ناو چی؟',a:'سەبەت',o:['دەروازە','نەت','سەبەت','ڕینگ']},
      {q:'یاری تێنس لە چەند کەس پێکهاتووە؟',a:'٢ یان ٤',o:['١ یان ٢','٢ یان ٤','٣ یان ٦','٢ یان ٣']},
      {q:'بۆکسێنەر دەبێت چی لە دەستەکانی بکات؟',a:'دەستکێش بپۆشێت',o:['باندی ببەستێت','دەستکێش بپۆشێت','دەستکێشی هەڵبگرێت','هیچ']},
      {q:'خولی ئیسپانیا بە چی دەناسرێت؟',a:'لالیگا',o:['پریمیەرلیگ','لالیگا','سێری ئەی','بوندسلیگا']},
      {q:'خولی ئینگلیزی بە چی دەناسرێت؟',a:'پریمیەرلیگ',o:['لالیگا','سێری ئەی','پریمیەرلیگ','لیگ ١']},
    ],
    medium: [
      {q:'یەکەم جامی جیهانی تۆپی پێ لە کام وڵات ئەنجامدرا؟',a:'ئوروگوای',o:['بەرازیل','فەرەنسا','ئوروگوای','ئیتالیا']},
      {q:'کام یانە زۆرترین جار نازناوی چامپیۆنز لیگی بەدەستهێناوە؟',a:'ڕیال مادرید',o:['بارسەلۆنا','ڕیال مادرید','میلان','بایەرن']},
      {q:'کام وڵات بۆ یەکەمجار لە مێژوودا جامی جیهانی بردەوە؟',a:'ئوروگوای',o:['بەرازیل','ئیتالیا','ئوروگوای','ئەرجەنتین']},
      {q:'ناوی ئەو یاریزانەی کە بە "پادشای تۆپی پێ" ناسراوە چییە؟',a:'پێلێ',o:['مارادۆنا','پێلێ','رۆنالدۆ','مێسی']},
      {q:'کام یانە بە "خانمە پیرەکە" ناسراوە؟',a:'یوڤینتوس',o:['میلان','ئینتەر','یوڤینتوس','ڕۆما']},
      {q:'خەڵاتی "پوشکاش" بۆ چی دەدرێت؟',a:'جوانترین گۆڵی ساڵ',o:['باشترین یاریزان','زۆرترین گۆڵ','جوانترین گۆڵی ساڵ','باشترین گۆڵپارێز']},
      {q:'ناوی یاریگای تایبەتی یانەی ئەی سی میلان چییە؟',a:'سان سیرۆ',o:['بەرنابێو','وەمبلی','سان سیرۆ','ئانفیلد']},
      {q:'کام تیپ بە "شەیتانە سوورەکان" ناسراوە؟',a:'مانچستەر یونایتەد',o:['لیڤەرپووڵ','ئارسەنال','مانچستەر یونایتەد','چێلسی']},
      {q:'یاری "ماراسۆن" چەند کیلۆمەترە؟',a:'٤٢.١٩٥ کم',o:['٣٠ کم','٤٠ کم','٤٢.١٩٥ کم','٥٠ کم']},
      {q:'"بوندسلیگا" ناوی خولی کام وڵاتە؟',a:'ئەڵمانیا',o:['ئەوستریا','سوییس','ئەڵمانیا','هۆڵەندا']},
      {q:'لە تۆپی پێدا "هاتریك" واتای چییە؟',a:'٣ گۆڵ لە یەک یاری',o:['٢ گۆڵ لە یەک یاری','٣ گۆڵ لە یەک یاری','٤ گۆڵ لە یەک یاری','٥ گۆڵ لە یەک یاری']},
      {q:'"لیگ ١" ناوی خولی کام وڵاتە؟',a:'فەرەنسا',o:['بێلجیک','فەرەنسا','هۆڵەندا','پۆرتوگاڵ']},
      {q:'یاری "سۆمۆ" سەر بە کلتووری کام وڵاتە؟',a:'ژاپۆن',o:['چین','کۆریا','ژاپۆن','مۆنگۆلیا']},
      {q:'خولی "سێری ئەی" لە کام وڵات بەڕێوەدەچێت؟',a:'ئیتالیا',o:['ئیسپانیا','فەرەنسا','ئیتالیا','پۆرتوگاڵ']},
      {q:'وڵاتی "کەنەدا" بە کام وەرزشی سەهۆڵین بەناوبانگە؟',a:'هۆکی',o:['باسکێت','هۆکی','بێیسبۆڵ','ئامریکی فوتبۆڵ']},
    ],
    hard: [
      {q:'گۆڵپارێزێک کە بە "جاڵجاڵۆکەی ڕەش" ناسرابوو کێ بوو؟',a:'لێو یاشین',o:['پیتەر شمایکل','لێو یاشین','گۆردۆن بانکس','دینۆ زۆف']},
      {q:'یەکەم یاریزانی ئەفریقی کە تۆپی ئاڵتوونی بەدەستهێنا کێ بوو؟',a:'جورج ویا',o:['دیدییە دروگبا','ساموێل ئیتۆ','جورج ویا','ریادح محرز']},

      {q:'ئیجتیهاد لە ئیسلامدا چییە؟',a:'هەوڵدانی فیقهی بۆ دۆزینەوەی حوکمی نوێ',o:['ڕۆژوو','نوێژی تایبەت','هەوڵدانی فیقهی بۆ دۆزینەوەی حوکمی نوێ','نووسینی قورئان']},
    ]
  }
};

let currentCat = '';
let allQuestions = [];
let qIndex = 0;
let score = 0;
let timer = null;
let timeLeft = 15;
let answered = false;

const levelOrder = ['easy','medium','hard'];
const levelNames = {easy:'🟢 ئاسان', medium:'🟡 مامناوەند', hard:'🔴 قورس'};
const bannerClass = {easy:'banner-easy', medium:'banner-medium', hard:'banner-hard'};

function showLanding() {
  document.getElementById('landing').style.display = 'flex';
  document.getElementById('quiz-page').style.display = 'none';
  clearInterval(timer);
}

function startCategory(cat) {
  currentCat = cat;
  allQuestions = [
    ...data[cat].easy.map(q=>({...q,level:'easy'})),
    ...data[cat].medium.map(q=>({...q,level:'medium'})),
    ...data[cat].hard.map(q=>({...q,level:'hard'}))
  ];
  qIndex = 0;
  score = 0;
  document.getElementById('landing').style.display = 'none';
  document.getElementById('quiz-page').style.display = 'block';
  document.getElementById('score-num').textContent = '0';
  loadQuestion();
}

function loadQuestion() {
  if (qIndex >= allQuestions.length) { showResult(); return; }
  answered = false;
  const q = allQuestions[qIndex];
  const total = allQuestions.length;

  document.getElementById('q-counter').textContent = `${toK(qIndex+1)} / ${toK(total)}`;
  document.getElementById('progress-fill').style.width = ((qIndex/total)*100)+'%';

  const banner = document.getElementById('level-banner');
  banner.textContent = levelNames[q.level];
  banner.className = 'level-banner '+bannerClass[q.level];

  document.getElementById('question-text').textContent = q.q;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  const shuffled = [...q.o].sort(()=>Math.random()-0.5);
  shuffled.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${['أ','ب','ج','د'][i]}</span>${opt}`;
    btn.onclick = ()=>selectAnswer(btn, opt, q.a);
    list.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 15;
  updateTimerUI();
  timer = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if(timeLeft<=0){ clearInterval(timer); if(!answered) timeUp(); }
  },1000);
}

function updateTimerUI() {
  document.getElementById('timer-num').textContent = timeLeft;
  const arc = document.getElementById('timer-arc');
  const num = document.getElementById('timer-num');
  const pct = timeLeft/15;
  arc.style.strokeDashoffset = 219.9*(1-pct);
  const col = timeLeft>8?'var(--green)':timeLeft>4?'var(--medium-c)':'var(--red)';
  arc.style.color = col;
  num.className = 'timer-num '+(timeLeft>8?'timer-ok':timeLeft>4?'timer-warn':'timer-danger');
}

function selectAnswer(btn, selected, correct) {
  if(answered) return;
  answered = true;
  clearInterval(timer);
  disableAll();
  if(selected===correct){
    btn.classList.add('correct');
    score++;
    document.getElementById('score-num').textContent = score;
    spawnParticles(btn);
  } else {
    btn.classList.add('wrong');
    highlightCorrect(correct);
  }
  setTimeout(()=>{ qIndex++; loadQuestion(); }, 1300);
}

function timeUp() {
  answered = true;
  disableAll();
  highlightCorrect(allQuestions[qIndex].a);
  setTimeout(()=>{ qIndex++; loadQuestion(); }, 1300);
}

function disableAll() {
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
}

function highlightCorrect(correct) {
  document.querySelectorAll('.option-btn').forEach(b=>{
    if(b.textContent.includes(correct)) b.classList.add('correct');
  });
}

function spawnParticles(el) {
  const r = el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  ['#FFD700','#00FF88','#FF88FF','#88FFFF'].forEach((c,i)=>{
    for(let j=0;j<3;j++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.cssText=`left:${cx}px;top:${cy}px;width:8px;height:8px;background:${c};--tx:${(Math.random()-.5)*140}px;--ty:${(Math.random()-1.3)*120}px;`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),1000);
    }
  });
}

function showResult() {
  const total = allQuestions.length;
  const pct = Math.round((score/total)*100);
  let emoji,msg,stars;
  if(pct>=90){emoji='🏆';msg='فەوقەڵعادە! تۆ ئوستایی!';stars='⭐⭐⭐';}
  else if(pct>=70){emoji='🎉';msg='زۆر باشت کرد!';stars='⭐⭐';}
  else if(pct>=50){emoji='👍';msg='باشە، بەردەوام بە!';stars='⭐';}
  else{emoji='💪';msg='هەوڵ بدەوە دووبارە!';stars='';}

  const ov=document.createElement('div');
  ov.className='result-overlay';
  ov.innerHTML=`<div class="result-card">
    <div class="result-emoji">${emoji}</div>
    <div class="result-title">کۆتایی هات!</div>
    <div class="stars">${stars}</div>
    <div class="result-score">${toK(score)}<span> / ${toK(total)}</span></div>
    <div class="result-msg">${msg}<br><small style="color:var(--gold)">${toK(pct)}٪ گۆڵی هێنا</small></div>
    <div class="result-btns">
      <button class="btn-primary" onclick="this.closest('.result-overlay').remove();startCategory('${currentCat}')">🔄 دووبارە</button>
      <button class="btn-secondary" onclick="this.closest('.result-overlay').remove();showLanding()">🏠 سەرەتا</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}

function toK(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
</script>
